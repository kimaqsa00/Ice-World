<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Place Your Order</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
padding:40px;
}

.container{
width:650px;
background:#fff;
padding:35px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.12);
}

h2{
text-align:center;
color:#f39c12;
margin-bottom:25px;
}

.product-box{
display:flex;
gap:20px;
align-items:center;
background:#fafafa;
padding:15px;
border-radius:10px;
margin-bottom:25px;
}

.product-box img{
width:120px;
height:120px;
object-fit:cover;
border-radius:10px;
}

.product-info h3{
margin-bottom:10px;
}

.product-info p{
margin:5px 0;
color:#555;
}

.input-box{
margin-bottom:18px;
}

label{
display:block;
margin-bottom:8px;
font-weight:bold;
}

input,
textarea,
select{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
outline:none;
font-size:15px;
}

input:focus,
textarea:focus,
select:focus{
border-color:#f39c12;
}

.total{
font-size:22px;
font-weight:bold;
color:#f39c12;
margin:20px 0;
}

button{
width:100%;
padding:14px;
background:#f39c12;
color:#fff;
border:none;
border-radius:8px;
font-size:17px;
cursor:pointer;
font-weight:bold;
transition:.3s;
margin-top:10px;
}

button:hover{
background:#e67e22;
}

.success{
display:none;
margin-top:25px;
padding:20px;
background:#d4edda;
color:#155724;
border-radius:10px;
text-align:center;
font-size:18px;
}

.shopping-btn{
display:none;
text-align:center;
margin-top:15px;
}

.shopping-btn a{
display:inline-block;
padding:12px 30px;
background:#333;
color:#fff;
text-decoration:none;
border-radius:8px;
font-weight:bold;
}

.shopping-btn a:hover{
background:#111;
}
</style>

</head>
<body>

<div class="container">

<h2>Place Your Order</h2>

<div class="product-box">

<img id="productImg" src="">

<div class="product-info">

<h3 id="productName"></h3>

<p>Price : <b>$<span id="productPrice"></span></b></p>

</div>

</div>

<form id="orderForm">

<div class="input-box">

<label>Quantity</label>

<select id="qty">

<option value="1">1</option>

<option value="2">2</option>

<option value="3">3</option>

<option value="4">4</option>

<option value="5">5</option>

</select>

</div>

<div class="total">
Total : $<span id="total">5.49</span>
</div>

<div class="input-box">
<label>Full Name</label>
<input type="text" required>
</div>

<div class="input-box">
<label>Phone Number</label>
<input type="tel" required>
</div>

<div class="input-box">
<label>Delivery Address</label>
<textarea rows="4" required></textarea>
</div>

<button type="submit">
Place Order
</button>

</form>

<div class="success" id="success">
    ✅ Order Placed Successfully!
    <br><br>
    Quantity: <span id="finalQty"></span><br>
    Total Amount: $<span id="finalTotal"></span>
</div>

<div class="shopping-btn" id="shop">

<a href="menu.html">

Continue Shopping

</a>

</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const name = params.get("name");
const price = parseFloat(params.get("price"));
const img = params.get("img");

document.getElementById("productName").innerHTML = name;
document.getElementById("productPrice").innerHTML = price.toFixed(2);
document.getElementById("productImg").src = img;

const qty = document.getElementById("qty");
const total = document.getElementById("total");

total.innerHTML = price.toFixed(2);

qty.onchange = function () {
    total.innerHTML = (price * this.value).toFixed(2);
};

document.getElementById("orderForm").onsubmit = function (e) {

    e.preventDefault();

    document.getElementById("finalQty").innerHTML = qty.value;

    document.getElementById("finalTotal").innerHTML =
        (price * qty.value).toFixed(2);

    document.getElementById("success").style.display = "block";
    document.getElementById("shop").style.display = "block";

    this.style.display = "none";
};

</script>

</body>
</html>
